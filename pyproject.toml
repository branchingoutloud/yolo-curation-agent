[project]
name = "yolo-deep-agent"
version = "0.1.0"
description = "Autonomous YOLO curation & training deep agent (deepagents-native)"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langgraph-cli[inmem]",
    "langchain-core",
    "langchain-mcp-adapters",
    "langchain-tavily",
    "langchain-groq",
    "langchain-ollama",
    "modal",
    "python-dotenv",
    "requests",
    "pyyaml",
    "pillow",
    "imagehash",
]
# NOTE: ultralytics/supervision are NOT listed here on purpose - they run
# inside the Modal sandbox image (see backends/sandboxes.py), never imported
# by this orchestrator process itself. Keeping them out of the local venv
# avoids pulling in torch locally for no benefit.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subagents", "tools", "backends"]
